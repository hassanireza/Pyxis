<svg width="1160" height="460" viewBox="0 0 1160 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1160" height="460" rx="14" fill="#08090b" />
  <rect x="0.5" y="0.5" width="1159" height="459" rx="13.5" stroke="#1c2126" />

  <text x="36" y="38" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#6e7579" letter-spacing="0.08em">BROWSER TAB · STATIC HOSTING, NO BACKEND</text>

  <!-- Main thread -->
  <rect x="32" y="54" width="500" height="378" rx="10" fill="#0d1013" stroke="#1c2126" />
  <text x="52" y="82" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#e6e3da">Main thread</text>
  <text x="52" y="100" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#6e7579">React 18 UI · Zustand state · never touches Python directly</text>

  <rect x="52" y="116" width="220" height="34" rx="6" fill="#12161a" stroke="#1c2126" />
  <text x="64" y="137" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#9aa3a8">Toolbar + mode switch</text>

  <rect x="288" y="116" width="220" height="34" rx="6" fill="#12161a" stroke="#1c2126" />
  <text x="300" y="137" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#9aa3a8">Notebook view</text>

  <text x="52" y="172" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7c8891" letter-spacing="0.06em">NOTEBOOK</text>
  <rect x="52" y="180" width="456" height="34" rx="6" fill="#12161a" stroke="#1c2126" />
  <text x="64" y="201" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#9aa3a8">Cell editors — CodeMirror 6 (code + markdown)</text>

  <rect x="52" y="222" width="456" height="34" rx="6" fill="#12161a" stroke="#1c2126" />
  <text x="64" y="243" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#9aa3a8">Notebook store — cell state, execution, autosave</text>

  <text x="52" y="284" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7c8891" letter-spacing="0.06em">MD PREVIEWER</text>
  <rect x="52" y="292" width="456" height="34" rx="6" fill="#12161a" stroke="#1c2126" />
  <text x="64" y="313" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#9aa3a8">Write surface — Tiptap WYSIWYG (shared extension set)</text>

  <rect x="52" y="334" width="456" height="34" rx="6" fill="#12161a" stroke="#1c2126" />
  <text x="64" y="355" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#9aa3a8">Headless renderer — same extensions, off-screen → HTML</text>

  <rect x="52" y="376" width="456" height="34" rx="6" fill="#12161a" stroke="#1c2126" />
  <text x="64" y="397" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#9aa3a8">Import / export — .ipynb · .py · .md · .html · .json</text>

  <!-- Worker thread -->
  <rect x="568" y="54" width="500" height="222" rx="10" fill="#0d1013" stroke="#1c2126" />
  <text x="588" y="82" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#e6e3da">Dedicated Web Worker</text>
  <text x="588" y="100" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#6e7579">off the UI thread — a long-running cell never freezes the editor</text>

  <rect x="588" y="118" width="460" height="42" rx="6" fill="#12161a" stroke="#1c2126" />
  <text x="600" y="144" font-family="'Segoe UI', sans-serif" font-size="12" fill="#c9cfd2">Pyodide runtime — CPython compiled to WebAssembly</text>

  <rect x="588" y="172" width="460" height="42" rx="6" fill="#12161a" stroke="#1c2126" />
  <text x="600" y="198" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8fb3ac">micropip — install pure-Python / WASM packages at runtime</text>

  <rect x="588" y="226" width="460" height="34" rx="6" fill="#0d1013" stroke="#1c2126" stroke-dasharray="4 3" />
  <text x="600" y="247" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6e7579">stdout / stderr / result streamed back over postMessage</text>

  <!-- Arrows -->
  <line x1="532" y1="150" x2="564" y2="150" stroke="#7c8891" stroke-width="2" />
  <polygon points="564,144 564,156 576,150" fill="#7c8891" />
  <text x="533" y="140" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#6e7579">postMessage</text>

  <line x1="564" y1="196" x2="532" y2="196" stroke="#8fb3ac" stroke-width="2" />
  <polygon points="532,190 532,202 520,196" fill="#8fb3ac" />
  <text x="533" y="214" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#6e7579">stdout / result</text>

  <!-- CDN -->
  <rect x="568" y="296" width="500" height="60" rx="10" fill="#0d1013" stroke="#1c2126" stroke-dasharray="4 3" />
  <text x="588" y="322" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#9aa3a8">jsDelivr CDN</text>
  <text x="588" y="342" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6e7579">Pyodide WASM runtime — fetched once, cached by the browser after</text>

  <line x1="818" y1="276" x2="818" y2="296" stroke="#4a4f53" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Fonts CDN -->
  <rect x="568" y="372" width="500" height="60" rx="10" fill="#0d1013" stroke="#1c2126" stroke-dasharray="4 3" />
  <text x="588" y="398" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#9aa3a8">Google Fonts</text>
  <text x="588" y="418" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6e7579">Cormorant Garamond, Jost, JetBrains Mono — typefaces only, no code</text>

  <text x="36" y="452" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#6e7579">No server. No API calls carrying your code or your writing. Everything above runs on your machine.</text>
</svg>
