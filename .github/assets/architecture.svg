<svg width="920" height="360" viewBox="0 0 920 360" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="920" height="360" fill="#0a0b0f" />

  <!-- Browser tab boundary -->
  <rect x="20" y="20" width="880" height="320" rx="14" fill="#0d0f14" stroke="#262b38" />
  <text x="40" y="46" font-size="13" fill="#6b7288" letter-spacing="1">BROWSER TAB (GitHub Pages, static hosting)</text>

  <!-- Main thread -->
  <rect x="44" y="64" width="380" height="252" rx="10" fill="#12141b" stroke="#262b38" />
  <text x="60" y="90" font-size="14" font-weight="700" fill="#eef0f5">Main Thread</text>
  <text x="60" y="108" font-size="11" fill="#6b7288">React + TypeScript UI</text>

  <rect x="60" y="122" width="160" height="36" rx="6" fill="#171a23" stroke="#262b38" />
  <text x="70" y="144" font-size="12" fill="#a7aec2">Toolbar</text>

  <rect x="230" y="122" width="160" height="36" rx="6" fill="#171a23" stroke="#262b38" />
  <text x="240" y="144" font-size="12" fill="#a7aec2">Notebook View</text>

  <rect x="60" y="168" width="330" height="36" rx="6" fill="#171a23" stroke="#262b38" />
  <text x="70" y="190" font-size="12" fill="#a7aec2">Cell (Code / Markdown, CodeMirror 6)</text>

  <rect x="60" y="214" width="330" height="36" rx="6" fill="#171a23" stroke="#262b38" />
  <text x="70" y="236" font-size="12" fill="#a7aec2">Zustand store (notebook state, autosave)</text>

  <rect x="60" y="260" width="330" height="36" rx="6" fill="#171a23" stroke="#262b38" />
  <text x="70" y="282" font-size="12" fill="#a7aec2">Import / Export (.ipynb, .py, .md, .html)</text>

  <!-- Worker thread -->
  <rect x="460" y="64" width="380" height="180" rx="10" fill="#12141b" stroke="#262b38" />
  <text x="476" y="90" font-size="14" font-weight="700" fill="#eef0f5">Dedicated Web Worker</text>
  <text x="476" y="108" font-size="11" fill="#6b7288">off the UI thread, so typing never lags</text>

  <rect x="476" y="122" width="348" height="40" rx="6" fill="#171a23" stroke="#262b38" />
  <text x="488" y="147" font-size="12" fill="#7b9aec">Pyodide runtime (CPython on WebAssembly)</text>

  <rect x="476" y="172" width="348" height="40" rx="6" fill="#171a23" stroke="#262b38" />
  <text x="488" y="197" font-size="12" fill="#6ecabc">micropip (install pure Python / WASM packages)</text>

  <!-- Arrow between main and worker -->
  <line x1="424" y1="150" x2="456" y2="150" stroke="#5B7FE0" stroke-width="2" />
  <polygon points="456,144 456,156 468,150" fill="#5B7FE0" />
  <text x="428" y="140" font-size="10" fill="#6b7288">postMessage</text>

  <line x1="456" y1="180" x2="424" y2="180" stroke="#4FB8A8" stroke-width="2" />
  <polygon points="424,174 424,186 412,180" fill="#4FB8A8" />
  <text x="428" y="200" font-size="10" fill="#6b7288">stdout / result</text>

  <!-- CDN box -->
  <rect x="460" y="264" width="380" height="52" rx="10" fill="#0d0f14" stroke="#262b38" stroke-dasharray="4 3" />
  <text x="476" y="286" font-size="12" fill="#a7aec2">jsDelivr CDN</text>
  <text x="476" y="304" font-size="11" fill="#6b7288">Pyodide WASM runtime, fetched once and cached</text>

  <line x1="650" y1="244" x2="650" y2="264" stroke="#6b7288" stroke-width="2" stroke-dasharray="3 3" />

  <text x="44" y="344" font-size="11" fill="#6b7288">No server. No API calls with your code. Everything above runs on your machine.</text>
</svg>
